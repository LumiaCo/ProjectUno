<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>POLITIDEX v1.0</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#040904;overflow:hidden;font-family:'Press Start 2P',monospace;}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#060e06}::-webkit-scrollbar-thumb{background:#2d5a2d}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes blink{0%,49%{opacity:1}50%,99%{opacity:0}}
button{cursor:pointer;font-family:'Press Start 2P',monospace;}
button:hover{filter:brightness(1.4);}
#app{display:flex;flex-direction:column;width:100vw;height:100vh;overflow:hidden;position:relative;}
#scanlines{position:fixed;inset:0;pointer-events:none;z-index:999;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.04) 3px,rgba(0,0,0,.04) 4px);}
#header{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;border-bottom:2px solid #1a3a1a;background:#030806;flex-shrink:0;z-index:10;flex-wrap:wrap;gap:4px;}
#logo{display:flex;align-items:center;gap:10px;}
#logo-text{font-size:18px;color:#4eff4e;text-shadow:0 0 16px #4eff4e99;letter-spacing:3px;}
#logo-sub{font-size:6px;color:#2a6a2a;}
#controls{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.ctrl-btn{font-size:5px;padding:3px 6px;background:none;border:1px solid #2d5a2d;color:#2a7a2a;}
.ctrl-btn.active{border-color:var(--ac);color:var(--ac);background:rgba(128,128,128,.15);}
#disc-count{font-size:6px;color:#2a7a2a;}
#map-wrap{flex:1;overflow:hidden;position:relative;transition:padding-bottom .25s;}
#map-wrap.card-open{padding-bottom:56vh;}
#map-svg{width:100%;height:100%;display:block;cursor:crosshair;}
#tooltip{position:fixed;z-index:500;font-size:8px;color:#4eff4e;background:#060c06;border:1px solid #2d5a2d;padding:4px 8px;pointer-events:none;white-space:nowrap;box-shadow:0 0 8px #4eff4e44;display:none;}
#legend{position:absolute;bottom:8px;left:8px;z-index:10;display:flex;flex-direction:column;gap:3px;transition:bottom .25s;}
#legend.card-open{bottom:58vh;}
.leg-row{display:flex;align-items:center;gap:4px;}
.leg-sw{width:10px;height:10px;flex-shrink:0;}
.leg-lbl{font-size:5.5px;color:#2a7a2a;}
/* LOADING */
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#040904;z-index:50;}
#load-text{font-size:14px;color:#4eff4e;text-shadow:0 0 20px #4eff4e;animation:blink 1s infinite;}
#load-sub{font-size:7px;color:#2a7a2a;}
/* CARD */
#card{position:fixed;bottom:0;left:0;right:0;z-index:200;height:56vh;background:#060e06;border-top:3px solid #2d5a2d;border-left:3px solid #2d5a2d;border-right:3px solid #2d5a2d;display:none;flex-direction:column;overflow:hidden;}
#card-sl{position:absolute;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.07) 3px,rgba(0,0,0,.07) 4px);}
#card-hd{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;border-bottom:2px solid #1a3a1a;background:#030806;flex-shrink:0;z-index:2;}
#card-id{font-size:7px;color:#2a7a2a;}
#card-nm{font-size:10px;color:#4eff4e;text-shadow:0 0 10px #4eff4e88;}
#card-hdr{display:flex;gap:8px;align-items:center;}
#type-badge{font-size:6px;padding:2px 6px;color:#fff;border:1px solid #fff;display:none;}
#hth-btn{font-size:6px;padding:2px 8px;background:none;border:1px solid #ff8800;color:#ff8800;}
#close-btn{font-size:6px;padding:2px 8px;background:none;border:1px solid #882222;color:#882222;}
#card-body{display:flex;flex:1;overflow:hidden;z-index:2;}
#card-left{width:155px;flex-shrink:0;border-right:2px solid #1a3a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px;gap:5px;background:#030806;}
#c-flag{font-size:60px;line-height:1;filter:drop-shadow(0 0 12px rgba(0,255,65,.3));}
#c-meta{font-size:6px;color:#2a7a2a;text-align:center;line-height:1.9;}
#c-elec{font-size:5.5px;color:#ffff44;text-align:center;border:1px solid #888800;padding:3px 4px;background:#222200;animation:pulse 1.5s infinite;display:none;}
#c-als{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:2px;}
.al-tag{font-size:5px;padding:1px 3px;border:1px solid;}
#card-right{flex:1;padding:8px 12px;overflow-y:auto;}
.st-row{display:flex;align-items:center;gap:4px;margin-bottom:3px;}
.st-lbl{font-size:5.5px;color:#3a7a3a;width:50px;text-align:right;flex-shrink:0;}
.st-pips{display:flex;gap:1.5px;}
.pip{width:10px;height:8px;border:1px solid #080e08;}
.st-val{font-size:6px;width:22px;text-align:right;}
#ide-wrap{position:relative;width:106px;height:8px;border:1px solid #080e08;background:linear-gradient(to right,#4488ff,#555,#ee2222);}
#ide-cur{position:absolute;top:-2px;width:2px;height:12px;background:#fff;transform:translateX(-50%);}
#ide-lbl{font-size:5px;color:#4eff4e;width:46px;}
#flavor-sec{margin-top:6px;padding-top:6px;border-top:1px solid #1a3a1a;}
#flavor-btn{font-size:6px;padding:4px 10px;background:none;border:1px solid #2d5a2d;color:#4eff4e;}
#flavor-txt{font-size:6px;color:#4eff4e;line-height:2;margin:0;display:none;}
/* H2H */
#hth{position:fixed;inset:0;z-index:300;background:#040904;display:none;flex-direction:column;overflow-y:auto;}
#hth-sl{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px);}
#hth-hd{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-bottom:2px solid #1a3a1a;background:#030806;flex-shrink:0;z-index:1;}
#hth-title{font-size:13px;color:#ff8800;text-shadow:0 0 12px #ff880088;}
#hth-body{padding:12px 16px;flex:1;z-index:1;}
#hth-slots{display:flex;margin-bottom:16px;}
.slot{flex:1;border:2px solid #2d5a2d;padding:8px;text-align:center;background:#030806;}
.slot.empty{border-style:dashed;display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:110px;font-size:8px;color:#2a7a2a;gap:4px;}
.slot-flag{font-size:36px;margin-bottom:4px;}
.slot-name{font-size:7px;color:#4eff4e;margin-bottom:4px;}
.slot-type{font-size:5px;margin-bottom:4px;}
.slot-pop{font-size:5px;color:#2a7a2a;}
#hth-vs{display:flex;align-items:center;justify-content:center;width:40px;flex-shrink:0;font-size:11px;color:#ff8800;text-shadow:0 0 8px #ff880088;}
#hth-stats{display:flex;flex-direction:column;gap:8px;}
.hs-row{}
.hs-labels{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.hs-l{font-size:6px;width:28px;text-align:right;}
.hs-n{font-size:6px;color:#3a7a3a;flex:1;text-align:center;}
.hs-r{font-size:6px;width:28px;}
.hs-bars{display:flex;height:8px;gap:2px;}
.hs-bl{flex:1;display:flex;justify-content:flex-end;background:#0e180e;overflow:hidden;}
.hs-bl-fill{height:100%;transition:width .6s;}
.hs-div{width:2px;background:#2d5a2d;flex-shrink:0;}
.hs-br{flex:1;background:#0e180e;overflow:hidden;}
.hs-br-fill{height:100%;transition:width .6s;}
#hth-win{margin-top:12px;text-align:center;font-size:9px;color:#ffff44;text-shadow:0 0 12px #ffff4488;padding:8px;border:2px solid #888800;background:#111100;display:none;}
#hth-empty{text-align:center;font-size:8px;color:#2a7a2a;margin-top:20px;line-height:2.5;}
</style>
</head>

function getFill(cca3,hov){
  if(!cca3)return"#111a11";
  if(S.sel===cca3)return"#4eff4e";
  if(S.al){const a=ALLIANCES[S.al];if(a?.m.has(cca3))return hov?a.color:a.color+"aa";return"#0a110a";}
  if(S.heat){const v=calcStats(cca3)[S.heat]/100;const g=Math.round(30+v*200),rb=Math.round(v*40);return hov?`rgb(${rb+30},${g+30},${rb+30})`:`rgb(${rb},${g},${rb})`;}
  const t=CTYPES[cca3],base=t?PTYPES[t]?.color:"#2d5a2d";
  if(hov)return(base||"#2d5a2d")+"ee";
  if(S.disc.has(cca3))return(base||"#2d5a2d")+"99";
  return(base||"#2d5a2d")+"66";
}
function recolor(){cg.selectAll("path.country").attr("fill",d=>getFill(S.lk[d.id],S.hov===d.id));}

}

function setPips(rowId,val,color){
  const r=document.getElementById(rowId);if(!r)return;
  const p=r.querySelector(".st-pips"),v=r.querySelector(".st-val");
  const f=Math.round(val/10);p.innerHTML="";
  for(let i=0;i<10;i++){const d=document.createElement("div");d.className="pip";d.style.background=i<f?color:"#0e180e";p.appendChild(d);}
  v.textContent=val;v.style.color=color;
}
function showCard(cca3){
  const nm=CNAMES[cca3]||cca3,cd=CDATA[cca3]||{},st=calcStats(cca3);
  const t=CTYPES[cca3],td=t?PTYPES[t]:null,als=getCAs(cca3),elec=ELECTIONS[cca3];
  const ccn=Object.entries(CCN3).find(([,v])=>v===cca3)?.[0]||"???";

  document.getElementById("card-nm").textContent=nm.toUpperCase();
  document.getElementById("c-flag").textContent=getFlag(cca3);

  else badge.style.display="none";

  if(cd.cap)m+=`🏛 ${cd.cap}<br/>`;
  if(cd.pop)m+=`👥 ${fmtPop(cd.pop*1e6)}<br/>`;
  if(cd.reg)m+=`🌍 ${cd.reg}`;

  if(elec){document.getElementById("c-elec-date").textContent=elec;ee.style.display="block";}else{ee.style.display="none";}

  setPips("sr-power",st.power,"#ff5555");

  setPips("sr-military",st.military,"#ff8844");
  setPips("sr-population",st.population,"#44ddff");
  setPips("sr-diplomacy",st.diplomacy,"#4488ff");
  setPips("sr-approval",st.approval,"#44ff88");
  document.getElementById("ide-cur").style.left=st.ideology+"%";
  document.getElementById("ide-lbl").textContent=st.ideology<30?"◀ LEFT":st.ideology>70?"RIGHT ▶":"▪ CENTER";
  const fb=document.getElementById("flavor-btn"),ft=document.getElementById("flavor-txt");
  if(S.flavors[cca3]){fb.style.display="none";ft.textContent=S.flavors[cca3];ft.style.display="block";}

function renderSlot(elId,cca3){

  const nm=CNAMES[cca3]||cca3,t=CTYPES[cca3],td=t?PTYPES[t]:null,cd=CDATA[cca3]||{};
  el.className="slot";
  el.innerHTML=`<div class="slot-flag">${getFlag(cca3)}</div><div class="slot-name">${nm.toUpperCase()}</div>${td?`<div class="slot-type" style="color:${td.color}">${td.emoji} ${td.label}</div>`:""} ${cd.pop?`<div class="slot-pop">${fmtPop(cd.pop*1e6)}</div>`:""}`;

function renderHth(){
  renderSlot("slot-l",S.hth[0]||null);renderSlot("slot-r",S.hth[1]||null);
  const sd=document.getElementById("hth-stats"),wd=document.getElementById("hth-win"),em=document.getElementById("hth-empty");
  if(S.hth[0]&&S.hth[1]){
    em.style.display="none";
    const s0=calcStats(S.hth[0]),s1=calcStats(S.hth[1]);
    const SK=[{k:"power",l:"POWER",c:"#ff5555"},{k:"economy",l:"ECONOMY",c:"#ffdd44"},{k:"military",l:"MILITARY",c:"#ff8844"},{k:"population",l:"POPULACE",c:"#44ddff"},{k:"diplomacy",l:"DIPLOMAT",c:"#4488ff"},{k:"approval",l:"APPROVAL",c:"#44ff88"}];
    sd.innerHTML=SK.map(({k,l,c})=>{
      const v0=s0[k],v1=s1[k],w=v0>v1?"l":v1>v0?"r":"t";
      return`<div class="hs-row"><div class="hs-labels"><span class="hs-l" style="color:${w==="l"?c:"#2a7a2a"}">${v0}${w==="l"?" ◀":""}</span><span class="hs-n">${l}</span><span class="hs-r" style="color:${w==="r"?c:"#2a7a2a"}">${w==="r"?"▶ ":""}${v1}</span></div><div class="hs-bars"><div class="hs-bl"><div class="hs-bl-fill" style="width:${v0}%;background:${w==="l"?c:c+"66"}"></div></div><div class="hs-div"></div><div class="hs-br"><div class="hs-br-fill" style="width:${v1}%;background:${w==="r"?c:c+"66"}"></div></div></div></div>`;
    }).join("");
    const wL=SK.filter(({k})=>s0[k]>s1[k]).length,wR=SK.filter(({k})=>s1[k]>s0[k]).length;
    const wc=wL>wR?S.hth[0]:wR>wL?S.hth[1]:null;

}

document.getElementById("hth-open").addEventListener("click",()=>S.showHth?hideHthPanel():showHthPanel());
document.getElementById("close-btn").addEventListener("click",hideCard);
document.getElementById("hth-btn").addEventListener("click",()=>{if(S.sel)addHth(S.sel);});
document.getElementById("hth-close").addEventListener("click",hideHthPanel);
document.getElementById("hth-clear").addEventListener("click",()=>{S.hth=[];renderHth();updateHthBtn();});
document.getElementById("flavor-btn").addEventListener("click",async()=>{
  const cca3=S.sel;if(!cca3||S.loadF||S.flavors[cca3])return;
  S.loadF=true;const fb=document.getElementById("flavor-btn");fb.textContent="⟳ SCANNING...";fb.disabled=true;
  const st=calcStats(cca3),t=CTYPES[cca3]||"UNKNOWN",nm=CNAMES[cca3]||cca3;
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:`You are a Pokédex for world politics. Write a witty 2-3 sentence entry (max 45 words) for ${nm}. Type: ${t}. Power: ${st.power}/100. Economy: ${st.economy}/100. Military: ${st.military}/100. Approval: ${st.approval}%. Style: dry, factual, slightly ironic. Start with an observation about their political nature. Do NOT say "Pokédex".`}]})});
    const d=await r.json();S.flavors[cca3]=d.content?.[0]?.text||"DATA CORRUPTED.";
  }catch{S.flavors[cca3]="SIGNAL LOST. CHECK CONNECTION.";}
  S.loadF=false;
  if(S.sel===cca3){fb.style.display="none";const ft=document.getElementById("flavor-txt");ft.textContent=S.flavors[cca3];ft.style.display="block";}
});
const tt=document.getElementById("tooltip");
function showTT(nm,x,y){tt.textContent=nm;tt.style.display="block";tt.style.left=(x+14)+"px";tt.style.top=(y-36)+"px";}
function hideTT(){tt.style.display="none";}
// ══════ INIT ══════
async function init(){
  try{
    const topo=await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(r=>r.json());
    const feats=topojson.feature(topo,topo.objects.countries).features;
    feats.forEach(f=>{const c=CCN3[f.id];if(c)S.lk[f.id]=c;});
    cg.selectAll("path.country").data(feats).enter().append("path")
      .attr("class","country").attr("d",path)
      .attr("fill",d=>getFill(S.lk[d.id],false))
      .on("mouseover",function(e,d){
        S.hov=d.id;d3.select(this).attr("fill",getFill(S.lk[d.id],true));
        const n=S.lk[d.id]?(CNAMES[S.lk[d.id]]||S.lk[d.id]):null;if(n)showTT(n,e.clientX,e.clientY);
      })
      .on("mousemove",function(e,d){
        const n=S.lk[d.id]?(CNAMES[S.lk[d.id]]||S.lk[d.id]):null;if(n)showTT(n,e.clientX,e.clientY);
      })
      .on("mouseout",function(e,d){
        S.hov=null;d3.select(this).attr("fill",getFill(S.lk[d.id],false));hideTT();
      })
      .on("click",function(e,d){
        const cca3=S.lk[d.id];if(!cca3)return;
        S.sel=cca3;S.disc.add(cca3);
        document.getElementById("disc-count").textContent=`${S.disc.size}/195 DISCOVERED`;
        recolor();buildLegend();showCard(cca3);
      });
    document.getElementById("loading").style.display="none";
    buildLegend();
  }catch(err){
    document.getElementById("load-text").textContent="LOAD FAILED";
    document.getElementById("load-sub").textContent="NEEDS INTERNET: cdn.jsdelivr.net";
    console.error(err);
  }
}
init();
</script>
